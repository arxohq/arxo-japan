name: Japan addressed verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  japan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the published Arxo CLI
        run: npm install -g @arxo/cli@0.2.4
      - name: Verify source bytes, both packages and canonical example replay
        run: python3 tools/check.py
