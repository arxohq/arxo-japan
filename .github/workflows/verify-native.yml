name: Native law reader commands
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the published Arxo CLI
        run: npm install -g @arxo/cli@0.2.4
      - name: Verify native examples only
        run: python3 tools/check.py --examples-only
      - name: Inspect the saved Article 96 answer
        run: law inspect examples/amendment-eight-of-twelve/result.json summary
