# Manifest §10 — package root marker (DECISION-0033). The normative headers of
# §22 live in the .law files themselves; the manifest must agree with them
# (LDC-E1109, lawc check).
[package]
name = "jp.constitution"
version = "0.1.0"
language = "0.2"
namespace = "urn:jp:constitution:clir"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "jp-constitution"
# 日本国憲法 — the Constitution of Japan (1946): the preamble and all 103 articles.
title = "日本国憲法（昭和二十一年憲法）"
primarySource = "JP_CONSTITUTION"
jurisdiction = "JP"
instrument = "constitution"
sourceFidelity = "pinned_unofficial_copy"
# 国会 (the Diet) adopted the text; promulgated by the Emperor on 3 November 1946.
issuer = "国会 (National Diet of Japan); promulgated by the Emperor on 3 November 1946"
# legalStatus: `in_force`. No article has ever been amended since 1947; the
# disputes are about the INTERPRETATION of a text in force (Article 9), not
# about its validity.
legalStatus = "in_force"
# verifiedAgainstSource: byte-for-byte against the e-Gov API v2 extraction
# (sources/jp-constitution/provenance.json), a government database — not the
# bytes of the 官報 issue, hence PINNED_UNOFFICIAL_COPY with verified=true.
verifiedAgainstSource = true

# Scenarios: the single source of facts, questions and expectations.
[[tests]]
family = "jp_constitution"
suites = [
    "tests/01-voting.lawtest",
    "tests/ch01-emperor.lawtest",
    "tests/ch02-renunciation-of-war.lawtest",
