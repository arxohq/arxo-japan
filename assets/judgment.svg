<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="428" viewBox="0 0 1280 428" role="img"><title>Article 9: missing versus adjudicated assessment</title><rect width="1280" height="428" rx="24" fill="#f5f0e6"/><text x="38" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#162d46">ARTICLE 9 / NECESSARY-MINIMUM READING</text><rect x="38" y="87" width="570" height="215" rx="16" fill="#fff" stroke="#d9dfdf"/><text x="60" y="125" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Before the court assessment</text><text x="60" y="175" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#946827">REQUIRES_JUDGMENT</text><text x="60" y="214" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#162d46">Truth status: NEITHER</text><text x="60" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162d46">Open judgment requests: 1</text><rect x="652" y="87" width="570" height="215" rx="16" fill="#fff" stroke="#d9dfdf"/><text x="674" y="125" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">After a negative adjudicated assessment</text><text x="674" y="175" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#2b756a">COMPUTED</text><text x="674" y="214" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#162d46">Truth status: NEITHER</text><text x="674" y="259" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162d46">Open judgment requests: 0</text><text x="38" y="353" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#162d46">Same truth status. Different evidence and evaluation status.</text><text x="38" y="391" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#162d46">The court supplies the assessment; the model preserves its origin and polarity.</text></svg>